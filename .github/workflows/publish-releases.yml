name: Publish Flux release history

on:
  push:
    paths:
      - ".github/workflows/publish-releases.yml"

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write release notes
        shell: bash
        run: |
          mkdir -p .release-notes

          cat > .release-notes/v0.1.0.md <<'EOF'
          ## Flux — First Release

          Recovered from the original Flux development archive.

          ### Included
          - Dashboard
          - Tasks
          - Calendar
          - Statistics
          - SQLite task storage
          - Dark, Light and Sakura themes
          - Early animated backgrounds

          This is the baseline that established Flux's original page structure, dashboard statistics, task cards and theme system.

          > Historical milestone reconstructed from the original archived source.
          EOF

          cat > .release-notes/v0.2.0.md <<'EOF'
          ## Flux 1.1 — Patch

          The first major stability and behavior pass.

          ### Improvements
          - Better theme-change propagation across the app
          - Animation start/stop lifecycle handling
          - Dashboard refresh after task completion
          - Tasks, Calendar and Statistics refresh improvements
          - Reworked Sakura animation behavior
          - Theme-manager subscription/signaling improvements

          > Historical milestone reconstructed from the original archived source.
          EOF

          cat > .release-notes/v0.3.0.md <<'EOF'
          ## Flux 1.2 — Liquid Glass

          Flux's first clear visual-design update.

          ### Added
          - Refractive glass helpers
          - Glass-frame utilities
          - Glass icon-button styling

          ### Redesigned
          - Header
          - Sidebar
          - Stat cards
          - Task cards
          - Main productivity pages

          > Historical milestone reconstructed from the original archived source.
          EOF

          cat > .release-notes/v1.0.0.md <<'EOF'
          ## Flux — Notes Update

          A major recovered milestone from the later fixed/stability series.

          ### Added
          - Notes page
          - Notes manager and persistence
          - Note locking / PIN support
          - Note search and management flows
          - Expanded icon system

          This generation also includes the Settings and Lock Screen work introduced throughout the preceding fixed builds.

          > Historical milestone reconstructed from the original archived source.
          EOF

          cat > .release-notes/v1.0.1.md <<'EOF'
          ## Flux — Themes & Quality-of-Life Update

          The current major Flux generation.

          ### Added
          - Focus page with timer presets and session tracking
          - Weekly Progress and configurable weekly goals
          - Task sorting
          - Undo after deleting tasks
          - Toast notifications
          - Quote/banner component
          - Reduce-motion option
          - Custom themes and live customization
          - Dedicated theme picker
          - Expanded branding system

          ### Theme expansion
          Astro · Borealis · Ember · Forest · Mono · Nebula · Ocean · Snow · Synthwave · Void · Custom

          ### Animation expansion
          - Astro planetary background
          - Synthwave background
          - More configurable Aurora and Stars effects

          ### Downloads
          - **FluxSetup.exe** — standard Windows installer
          - **Flux-portable-windows.zip** — portable Windows build
          EOF

          cat > .release-notes/v1.0.2.md <<'EOF'
          ## Flux v1.0.2 — Developer BETA

          This hotfix replaces the first Frost Dock implementation after it introduced heavy lag and a cluttered navigation look.

          ### Performance fixes
          - Removed the expensive 90 ms multi-layer live capture.
          - Moved blur outside the dock into a separate bottom atmosphere layer.
          - Reduced blur sampling to a lightweight low-resolution pass.
          - Removed page-wide fade effects during navigation.
          - Fixed blur positioning and stacking after the dock refactor.

          ### Dock redesign
          - Bigger, clearer line icons.
          - One moving active pill instead of multiple busy selected states.
          - Cleaner glass capsule with restrained borders and highlights.
          - Removed labels, progress rail and decorative center line.
          - Settings remains separated as a system control.
          - Added a full-width bottom gradient blur inspired by modern mobile docks while keeping Flux's own theme-reactive identity.

          ### Downloads
          - **FluxSetup.exe** — Windows installer
          - **Flux-portable-windows.zip** — portable Windows build
          EOF

          cat > .release-notes/v1.0.3.md <<'EOF'
          ## Flux v1.0.3 — Developer BETA

          ### Navigation
          - Larger dock icons and a larger active glass bubble.
          - Wider/taller dock with cleaner spacing and a stronger theme-reactive rim.
          - Removed the hard-edged bottom panel.
          - Replaced it with a feathered bottom atmosphere fade that starts fully transparent.
          - Removed duplicate active-pill animation calls.

          ### Performance
          - Removed all live background grabbing from the dock.
          - Dashboard, Tasks, Notes, Calendar, Focus and Statistics now render first and refresh on the next event-loop tick.
          - Tab switches no longer wait on synchronous refresh work before becoming visible.

          ### Motion
          - Aurora, Stars, Sakura, Astro and Synthwave now use precise ~60 FPS timers instead of the previous ~30 FPS timers.
          - Particle and Sakura movement is time-scaled so the higher frame rate keeps the same animation speed.

          ### Downloads
          - **FluxSetup.exe** — Windows installer
          - **Flux-portable-windows.zip** — portable Windows build
          EOF

      - name: Create or update historical releases
        shell: bash
        run: |
          publish_release () {
            TAG="$1"
            TITLE="$2"
            NOTES="$3"

            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release edit "$TAG"                 --repo "$GITHUB_REPOSITORY"                 --title "$TITLE"                 --notes-file "$NOTES"                 --latest=false
            else
              gh release create "$TAG"                 --repo "$GITHUB_REPOSITORY"                 --target main                 --title "$TITLE"                 --notes-file "$NOTES"                 --latest=false
            fi
          }

          publish_release "v0.1.0" "Flux — First Release" ".release-notes/v0.1.0.md"
          publish_release "v0.2.0" "Flux 1.1 — Patch" ".release-notes/v0.2.0.md"
          publish_release "v0.3.0" "Flux 1.2 — Liquid Glass" ".release-notes/v0.3.0.md"
          publish_release "v1.0.0" "Flux — Notes Update" ".release-notes/v1.0.0.md"

      - name: Restore stable release and retract developer betas
        shell: bash
        run: |
          if gh release view "v1.0.1" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "v1.0.1"               --repo "$GITHUB_REPOSITORY"               --title "Flux — Themes & Quality-of-Life Update"               --notes-file ".release-notes/v1.0.1.md"               --latest
          fi

          if gh release view "v1.0.2" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "v1.0.2"               --repo "$GITHUB_REPOSITORY"               --title "Flux v1.0.2 — Developer BETA"               --notes-file ".release-notes/v1.0.2.md"               --draft               --latest=false
          fi

          if gh release view "v1.0.3" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "v1.0.3"               --repo "$GITHUB_REPOSITORY"               --title "Flux v1.0.3 — Developer BETA"               --notes-file ".release-notes/v1.0.3.md"               --draft               --latest=false
          fi
