name: Build Windows app

# Runs automatically whenever you push a tag like "v1.0.0", and can
# also be triggered manually from the Actions tab. It builds Flux on
# a real Windows machine (GitHub provides one for free), so you don't
# need Windows yourself just to produce Flux.exe / FluxSetup.exe.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller Flux.spec

      - name: Zip portable build
        shell: pwsh
        run: Compress-Archive -Path dist/Flux/* -DestinationPath Flux-portable-windows.zip

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Flux-windows-build
          path: |
            Flux-portable-windows.zip
            installer_output/FluxSetup.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Flux-portable-windows.zip
            installer_output/FluxSetup.exe
