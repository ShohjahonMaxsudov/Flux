name: Build Flux Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Smoke test redesigned UI
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          python -c "from PySide6.QtWidgets import QApplication; from app import Flux; app=QApplication([]); w=Flux(); app.processEvents(); print('Flux redesigned UI started successfully'); w.close(); app.quit()"

      - name: Build Flux
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean --windowed --onedir --name "Flux" --icon "assets\flux.ico" --version-file "version_info.txt" --contents-directory "." --add-data "assets;assets" --collect-submodules "themes" --collect-submodules "animations" --collect-submodules "ui" --collect-submodules "utils" --collect-submodules "database" "main.py"

      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\Flux\Flux.exe")) {
            Write-Error "dist\Flux\Flux.exe was not created."
            exit 1
          }

      - name: Create portable ZIP
        shell: pwsh
        run: Compress-Archive -Path dist/Flux/* -DestinationPath Flux-portable-windows.zip -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) {
            Write-Error "Inno Setup compiler not found."
            exit 1
          }

          & $iscc "installer.iss"

          if (-not (Test-Path "release\FluxSetup.exe")) {
            Write-Error "release\FluxSetup.exe was not created."
            exit 1
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Flux-windows-build
          path: |
            Flux-portable-windows.zip
            release/FluxSetup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Flux-portable-windows.zip
            release/FluxSetup.exe
