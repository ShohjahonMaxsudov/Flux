name: Publish Flux v1.2.0 stable release

on:
  push:
    paths:
      - ".release-notes/v1.2.0.md"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Promote release to latest stable
        shell: bash
        run: |
          set -euo pipefail
          TAG="v1.2.0"
          TITLE="Flux v1.2.0 — Performance & Habits Update"
          NOTES=".release-notes/v1.2.0.md"
          RELEASE_ID="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .id)"

          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID"             -f name="$TITLE"             -f body="$(cat "$NOTES")"             -F prerelease=false             -f make_latest=true
