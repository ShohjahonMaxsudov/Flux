name: QOL Sidebar Habits Preview

on:
  push:
    branches:
      - flux-qol-sidebar-habits
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flux-qol-sidebar-preview
  cancel-in-progress: true

jobs:
  qa:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Syntax
        shell: pwsh
        run: python -m compileall -q app.py animations database themes ui utils scripts

      - name: Smoke
        shell: pwsh
        run: python scripts/smoke_sidebar_qol.py

      - name: Render actual Habits screen
        shell: pwsh
        run: python scripts/render_sidebar_qol.py

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: Flux-correct-QOL-preview
          path: |
            preview-qol-sidebar-habits.png
            preview-qol-calendar.png
          if-no-files-found: error
          retention-days: 7