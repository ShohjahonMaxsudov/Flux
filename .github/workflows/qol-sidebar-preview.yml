name: QOL Sidebar Habits Preview\n\non:\n  push:\n    branches:\n      - flux-qol-sidebar-habits\n  workflow_dispatch:\n\npermissions:\n  contents: read\n\nconcurrency:\n  group: flux-qol-sidebar-preview\n  cancel-in-progress: true\n\njobs:\n  qa:\n    runs-on: windows-latest\n\n    steps:\n      - name: Checkout\n        uses: actions/checkout@v4\n\n      - name: Python\n        uses: actions/setup-python@v5\n        with:\n          python-version: "3.13"\n\n      - name: Dependencies\n        shell: pwsh\n        run: |\n          python -m pip install --upgrade pip\n          python -m pip install -r requirements.txt\n\n      - name: Syntax\n        shell: pwsh\n        run: python -m compileall -q app.py animations database themes ui utils scripts\n\n      - name: Smoke\n        shell: pwsh\n        run: python scripts/smoke_sidebar_qol.py\n\n      - name: Render actual Habits screen\n        shell: pwsh\n        run: python scripts/render_sidebar_qol.py\n\n      - name: Upload screenshot\n        uses: actions/upload-artifact@v4\n        with:\n          name: Flux-correct-QOL-preview\n          path: preview-qol-sidebar-habits.png\n          if-no-files-found: error\n          retention-days: 7